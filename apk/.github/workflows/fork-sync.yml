name: Fork Sync (Rebase)

on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight UTC
  workflow_dispatch:

jobs:
  sync-fork:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout your fork WITHOUT persisting GITHUB_TOKEN credentials
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Add upstream repo and fetch
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/keiyoushi/extensions.git
          git fetch upstream

      # Configure Git identity (required for rebasing rewritten commits)
      - name: Configure Git identity
        run: |
          git config user.name "HugoFMiranda"
          git config user.email "hugoeu10@gmail.com"

      # Rebase your branch on top of upstream/repo
      # This preserves your commits and applies upstream commits underneath them
      - name: Rebase repo onto upstream/repo
        run: |
          git checkout repo
          git pull --rebase upstream repo

      # Remove GitHub's default GITHUB_TOKEN credentials
      # Ensures your PAT is used for pushing workflow-file changes
      - name: Clear GITHUB_TOKEN credentials
        run: |
          git config --global --unset-all http.https://github.com/.extraheader || true

      # Push the rebased branch back to your fork
      # --force is required after a rebase and DOES NOT delete your ahead commits
      - name: Push rebased repo branch
        env:
          TOKEN: ${{ secrets.FORK_SYNC_BOT_TOKEN }}
        run: |
          git push --force https://x-access-token:${TOKEN}@github.com/HugoFMiranda/extensions.git repo
